let lang=localStorage.tilkiLang||'tr',filter='all';if(!T[lang])lang='tr';const dm=Object.fromEntries(D.map(x=>[x[0],x]));const txt=x=>typeof x==='string'?x:(x?.[lang]||x?.en||x?.tr||'');const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);const dn=id=>txt(dm[id][2]);
